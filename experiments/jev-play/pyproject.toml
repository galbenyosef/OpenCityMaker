[project]
name = "jev-play"
version = "0.1.0"
description = "Experiment: can TypeSafe's jev choice model play CityMaker (2048)?"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1"]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_play"]
